version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      - linters: [staticcheck]
        text: "QF1008"

formatters:
  enable:
    - gofmt
    - goimports